[package]
name = "ucc-academico"
version = "2.0.0"
description = "Sistema Integral de Gestión Académica y Matrículas — Universidad Cooperativa de Colombia"
authors = ["Alejandro Campo Solarte", "Juan Esteban Cardona Calambas", "Diego Fernando Gómez Rivera"]
edition = "2021"

[lib]
name = "ucc_academico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
