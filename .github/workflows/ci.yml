name: CI — Backend Pytest y Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ucc_admin
          POSTGRES_PASSWORD: ucc_test_password
          POSTGRES_DB: universidad_ucc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias backend
        run: pip install -r backend/requirements.txt
      - name: Ejecutar migraciones Alembic y pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ucc_admin:ucc_test_password@localhost:5432/universidad_ucc
          DEMO_MODE: "true"
          PYTHONPATH: .
        run: |
          alembic upgrade head
          python -m pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm build
